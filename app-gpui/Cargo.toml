[package]
name = "openidea-gpui"
description = "OpenIDEA desktop shell on GPUI: the Tauri webview replaced by a native Rust UI over the same backend crates"
version = "0.1.40"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[lib]
name = "openidea_gpui"
path = "src/lib.rs"

[[bin]]
name = "openidea-gpui"
path = "src/main.rs"

# Its own workspace: the root workspace (and its Cargo.lock, clippy, deny and nextest runs) stay
# exactly what the Tauri app is built from, so the final comparison is apples to apples.
[workspace]

[dependencies]
gpui-kit = "=0.9.1"
ide-agent = { path = "../crates/ide-agent" }
ide-core = { path = "../crates/ide-core" }
ide-build = { path = "../crates/ide-build" }
ide-dap = { path = "../crates/ide-dap" }
ide-db = { path = "../crates/ide-db" }
ide-docker = { path = "../crates/ide-docker" }
ide-github = { path = "../crates/ide-github" }
ide-host = { path = "../crates/ide-host" }
ide-index = { path = "../crates/ide-index" }
ide-lsp = { path = "../crates/ide-lsp" }
ide-plugin = { path = "../crates/ide-plugin" }
ide-run = { path = "../crates/ide-run" }
ide-search = { path = "../crates/ide-search" }
ide-terminal = { path = "../crates/ide-terminal" }
ide-vcs = { path = "../crates/ide-vcs" }
ide-language = { path = "../crates/ide-language", features = ["native-highlights"] }
ide-workspace = { path = "../crates/ide-workspace" }
ide-syntax = { path = "../crates/ide-syntax" }
ide-text = { path = "../crates/ide-text" }
ide-tools = { path = "../crates/ide-tools" }
ide-vfs = { path = "../crates/ide-vfs" }
ide-ssh = { path = "../crates/ide-ssh" }
dirs = "6"
futures = "0.3"
ropey = "1.6"
# Name ordering as the webview's Intl.Collator does it (the ICU version GPUI already locks).
icu_collator = "=2.4.0"
# The local time zone's offset at a given moment (the version the backend already locks).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# File-name patterns of the icon tables (already in the dependency graph).
regex = "1"
# Terminal emulation over ide-terminal's PTY bytes (the webview uses xterm.js).
alacritty_terminal = "0.26"
# Plugin web views and other HTML surfaces, created on demand (never at start-up).
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Plugin secrets in the login keychain (the version the backend's keyring already locks).
security-framework = "3"
# Whether a menu item was chosen by a key press (AppKit's current event), as the Tauri app asks.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder"] }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
tempfile = "3"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 2
debug = false

# Same as the root workspace's release profile (src-tauri builds with it).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = "debuginfo"
